<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — HR Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0ede8;
    --text: #1a1814; --text2: #6b6760; --text3: #9e9b96;
    --border: rgba(0,0,0,0.1);
    --green: #1a7a52; --green-bg: #e8f5ee;
    --red: #b53030; --red-bg: #fceaea;
    --accent: #2c5f8a; --accent-bg: #e8f0f8;
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  .home-header { text-align: center; padding: 48px 0 40px; }
  .home-header h1 { font-family: 'DM Serif Display', serif; font-size: 30px; font-weight: 400; line-height: 1.25; color: var(--text); margin-bottom: 12px; }
  .home-header p { font-size: 15px; color: var(--text2); line-height: 1.6; }
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin: 32px 0; }
  .mode-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; }
  .mode-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
  .mode-card .mc-icon { font-size: 24px; margin-bottom: 10px; }
  .mode-card .mc-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .mode-card .mc-sub { font-size: 13px; color: var(--text2); }
  .mode-card.featured { background: var(--text); }
  .mode-card.featured .mc-title { color: #fff; }
  .mode-card.featured .mc-sub { color: rgba(255,255,255,0.6); }
  .hint-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px 20px; font-size: 13px; color: var(--text2); line-height: 1.7; }
  .hint-box strong { color: var(--text); font-weight: 500; }
  .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .quiz-back { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 14px; font-size: 13px; font-family: 'DM Sans', sans-serif; color: var(--text2); cursor: pointer; }
  .quiz-back:hover { background: var(--surface2); }
  .score-pills { display: flex; gap: 8px; }
  .pill { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
  .pill.c { background: var(--green-bg); color: var(--green); }
  .pill.w { background: var(--red-bg); color: var(--red); }
  .progress-track { height: 4px; background: var(--surface2); border-radius: 2px; margin-bottom: 28px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
  .question-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px 22px; margin-bottom: 14px; }
  .q-num { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }
  .q-text { font-size: 15px; line-height: 1.65; color: var(--text); }
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .opt-btn { display: flex; align-items: flex-start; gap: 12px; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; text-align: left; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); line-height: 1.55; transition: border-color 0.15s, background 0.15s; width: 100%; }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-bg); }
  .opt-btn:disabled { cursor: default; }
  .opt-letter { font-weight: 600; min-width: 20px; color: var(--text3); font-size: 13px; padding-top: 1px; flex-shrink: 0; }
  .opt-btn.sc { background: var(--green-bg); border-color: var(--green); }
  .opt-btn.sc .opt-letter { color: var(--green); }
  .opt-btn.sw { background: var(--red-bg); border-color: var(--red); }
  .opt-btn.sw .opt-letter { color: var(--red); }
  .opt-btn.sr { background: var(--green-bg); border-color: var(--green); }
  .opt-btn.sr .opt-letter { color: var(--green); }
  .feedback { margin-top: 14px; padding: 12px 15px; border-radius: var(--radius-sm); font-size: 13px; line-height: 1.6; }
  .feedback.ok { background: var(--green-bg); color: #145e3e; border-left: 3px solid var(--green); }
  .feedback.no { background: var(--red-bg); color: #922626; border-left: 3px solid var(--red); }
  .nav-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-next { flex: 1; padding: 13px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .btn-next:hover { opacity: 0.85; }
  .result-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 24px; text-align: center; margin-top: 16px; }
  .result-pct { font-family: 'DM Serif Display', serif; font-size: 68px; color: var(--text); line-height: 1; }
  .result-msg { font-size: 15px; color: var(--text2); margin: 12px 0 28px; }
  .result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 28px; }
  .r-stat { background: var(--bg); border-radius: var(--radius-sm); padding: 14px 8px; }
  .r-val { font-size: 24px; font-weight: 600; }
  .r-lbl { font-size: 12px; color: var(--text2); margin-top: 3px; }
  .r-val.g { color: var(--green); } .r-val.r { color: var(--red); }
  .result-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn-solid { padding: 11px 24px; border: none; border-radius: var(--radius-sm); background: var(--text); color: white; font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  .btn-solid:hover { opacity: 0.85; }
  .btn-outline { padding: 11px 24px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; color: var(--text); cursor: pointer; }
  .btn-outline:hover { background: var(--surface2); }

  /* Responsive Mobile (320px – 480px) */
  @media (max-width: 480px) {
    .app { padding: 16px 12px 50px; }
    .home-header { padding: 32px 0 24px; }
    .home-header h1 { font-size: 24px; margin-bottom: 10px; }
    .home-header p { font-size: 14px; }
    .mode-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 24px 0; }
    .mode-card { padding: 16px 12px; }
    .mode-card .mc-icon { font-size: 20px; margin-bottom: 8px; }
    .mode-card .mc-title { font-size: 13px; }
    .mode-card .mc-sub { font-size: 12px; }
    .hint-box { padding: 12px 16px; font-size: 12px; }
    .quiz-header { margin-bottom: 16px; }
    .quiz-back { padding: 6px 12px; font-size: 12px; }
    .pill { padding: 4px 10px; font-size: 12px; }
    .progress-track { margin-bottom: 20px; }
    .question-card { padding: 18px 16px 16px; margin-bottom: 12px; }
    .q-num { font-size: 11px; margin-bottom: 10px; }
    .q-text { font-size: 14px; line-height: 1.6; }
    .options { gap: 6px; margin-top: 14px; }
    .opt-btn { padding: 10px 12px; gap: 10px; font-size: 13px; line-height: 1.5; }
    .opt-letter { font-size: 12px; min-width: 18px; }
    .feedback { margin-top: 10px; padding: 10px 12px; font-size: 12px; }
    .nav-row { gap: 8px; margin-top: 10px; }
    .btn-next { padding: 11px; font-size: 14px; }
    .result-wrap { padding: 30px 20px; margin-top: 12px; }
    .result-pct { font-size: 52px; }
    .result-msg { font-size: 14px; margin: 10px 0 20px; }
    .result-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .r-stat { padding: 12px 6px; }
    .r-val { font-size: 20px; }
    .r-lbl { font-size: 11px; margin-top: 2px; }
    .result-btns { gap: 8px; }
    .btn-solid, .btn-outline { padding: 10px 18px; font-size: 13px; }
  }

  /* Responsive Tablet (481px – 768px) */
  @media (min-width: 481px) and (max-width: 768px) {
    .app { padding: 20px 16px 55px; }
    .home-header { padding: 40px 0 32px; }
    .home-header h1 { font-size: 28px; margin-bottom: 12px; }
    .mode-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 28px 0; }
    .quiz-header { margin-bottom: 18px; }
    .question-card { padding: 22px 20px 20px; margin-bottom: 12px; }
    .q-text { font-size: 15px; }
    .opt-btn { padding: 11px 14px; font-size: 14px; }
    .result-pct { font-size: 60px; }
    .result-grid { gap: 10px; margin-bottom: 24px; }
    .r-val { font-size: 22px; }
  }

  /* Responsive Desktop (769px+) */
  @media (min-width: 769px) {
    /* Keep original styles */
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const Q = [
  {q:"Which of the following might an organization experience if they do not retain their employees? Select three that apply.",o:["A. Productivity loss","B. High error rates","C. Lower employee morale","D. Reduced training costs"],a:[0,1,2]},
  {q:"What would an organization use to reduce the risks of investing resources in a training program that may or may not be effective?",o:["A. A pilot test","B. A post-evaluation test","C. An after-action review","D. A learning test"],a:[0]},
  {q:"In addition to mergers and acquisitions, which of the following is an example of organization restructuring?",o:["A. Startups","B. Downsizing","C. Conducting interviews","D. Hiring contract workers"],a:[1]},
  {q:"The federal WARN Act requires certain organizations to provide how many days' notice prior to layoffs?",o:["A. 30","B. 60","C. 90","D. 120"],a:[1]},
  {q:"Which of the following programs can managers use to promote safety and awareness in the workplace?",o:["A. Social media campaigns","B. Employee safety committees","C. Third-party audits","D. Pop quizzes every quarter"],a:[1]},
  {q:"What common law doctrine addresses employers creating a hostile and unpleasant workplace leading to an employee's resignation?",o:["A. Constructive discharge","B. Defamation","C. Employment at will","D. Promissory estoppel"],a:[0]},
  {q:"During an audit, which of the following strategic planning efforts do HR professionals assist with?",o:["A. Understanding the current business and mission of the organization","B. Conducting performance reviews","C. Providing legal assistance","D. Managing the organization's IT infrastructure"],a:[0]},
  {q:"Which of the following are common types of workplace conflicts? Select two that apply.",o:["A. Conflicts involving power","B. Conflicts involving values","C. Conflicts involving lunch","D. Conflicts involving parking spots"],a:[0,1]},
  {q:"Which of the following are elements of performance management systems? Select all that apply.",o:["A. Goals","B. Structure","C. Corrective action","D. Demotions"],a:[0,1,2]},
  {q:"Fill in the blank: Questions intended to measure engagement should focus on discovering an employee's _____, level of involvement, and willingness to recommend the organization positively to family, friends, and acquaintances.",o:["A. intent to stay","B. intent to leave","C. hesitation to put in for a transfer","D. interest in volunteer work"],a:[0]},
  {q:"Which of the following options has employment relationships ranked from usually most committed to usually least committed to an organization?",o:["A. Employees, freelance, contractors","B. Interns, employees, contractors","C. Consultants, employees, volunteers","D. Apprentices, temporary workers, employees"],a:[0]},
  {q:"Which of the following is covered in an organization's code of ethics?",o:["A. Sanctions and disciplinary actions that result from code violations","B. Employee benefits and compensation packages","C. Marketing strategies and advertising campaigns","D. Technical specifications and product development processes"],a:[0]},
  {q:"What do social media policies enable organizations to do?",o:["A. Manage how employees represent themselves and reflect an organization's values online","B. Control employee personal social media accounts outside of work","C. Regulate employees' conversations and interactions on social media","D. Ban social media platforms for employees"],a:[0]},
  {q:"What obligations must organizations follow under the Family and Medical Leave Act (FMLA)?",o:["A. Provide up to 12 weeks of unpaid leave when employees welcome a new child, care for a family member, or receive medical care","B. Provide unlimited paid leave for any reason","C. Reduce work hours for all employees","D. Provide paid leave for vacations or personal reasons"],a:[0]},
  {q:"An organization offers all of its employees a company-wide, set yearly increase. Which of the following might determine what the raise amount is?",o:["A. The organization's financial performance","B. Employee performance","C. How long an employee has been with the organization","D. The organization's social media presence"],a:[0]},
  {q:"Which of the following are the types of leave that the FMLA identifies? Select three that apply.",o:["A. Continuous","B. Reduced","C. Intermittent","D. Enlarged"],a:[0,1,2]},
  {q:"An employee completes one hour's work in one hour and earns an hourly rate. Another employee completes the same amount of work in two hours and makes a portion of the hourly rate based on their completed work. What merit pay approach does this describe?",o:["A. The standard hour plan","B. The gainsharing plan","C. The rate plan","D. The individual incentive plan"],a:[0]},
  {q:"When determining employee compensation, why is it important to consider pay equity?",o:["A. It ensures workers with similar roles and responsibilities receive equal compensation","B. It ensures they pay their workers a fair market wage relative to other organizations","C. It ensures their pay practices comply with all applicable laws and regulations","D. It ensures employees receive higher pay for less work"],a:[0]},
  {q:"What takes place when workers earn similar salaries regardless of their experience, skills, or seniority?",o:["A. Wage compression","B. Pay equity","C. Salary differentiation","D. Wage control"],a:[0]},
  {q:"An HR manager aims to ensure that jobs of similar value receive equal compensation. What compensation concept are they hoping to achieve?",o:["A. Internal equity","B. Job rotation","C. Employee benefits","D. Performance pay"],a:[0]},
  {q:"An organization conducts workplace training covering the internal policies and procedures related to honesty and integrity, respect, and upholding the organization's standards. What type of training did they implement?",o:["A. Code of conduct and ethics training","B. Information security training","C. Health and safety training","D. Workplace behavior training"],a:[0]},
  {q:"Which of the following are ways to informally collect feedback about employees' impressions of a training program? Select three that apply.",o:["A. Interviews","B. Surveys","C. Questionnaires","D. Social media"],a:[0,1,3]},
  {q:"Which of the following describes the difference between instructor-led versus self-paced training?",o:["A. In instructor-led training, employees learn with an instructor in-class or in a live online class; self-paced training allows learners to choose when the training best fits their schedule","B. In self-paced training, employees learn with an instructor in-class or in a live online class; instructor-led training allows learners to choose when the training best fits their schedule","C. In instructor-led training, employees learn with an assigned mentor; self-paced training allows learners to choose when the training best fits their schedule","D. In instructor-led training, employees take courses at a university; self-paced training allows employees to learn with an instructor in-class or in a live online class"],a:[0]},
  {q:"Dividing the total amount of money spent on a training by the number of participants is an example of which of the following metrics for training?",o:["A. Data and scores from courses","B. Learner engagement","C. Cost per employee","D. Return on investment"],a:[2]},
  {q:"What happens during the 'analyze' level according to Bloom's taxonomy framework?",o:["A. Employees organize, relate, compare and contrast, or test their knowledge through critical thinking skills","B. Employees justify a decision by arguing, defending, judging, critiquing, or supporting it based on what they have learned","C. Employees produce new or original content based on what they have learned","D. Employees recognize and recall facts, terms, concepts, or procedures"],a:[0]},
  {q:"What career planning tool enables employees to advance in their profession without becoming managers?",o:["A. Dual career ladders","B. Succession planning","C. Non-managerial promotion","D. Apprenticeship"],a:[0]},
  {q:"During an employee's first day, they receive information regarding employee procedures, policies, and benefits. What did they receive?",o:["A. An employee handbook","B. A company workbook","C. An employee laptop","D. An HR handbook"],a:[0]},
  {q:"A high school graduate considers their career plans and decides to become a healthcare provider, focusing on children's health. They research the requirements they need to reach this career goal. What phase of career development is the high school graduate in?",o:["A. Preparation","B. Investigation","C. Commitment","D. Retention"],a:[1]},
  {q:"What is the first phase of career development?",o:["A. Assessment","B. Preparation","C. Investigation","D. Commitment"],a:[0]},
  {q:"An organization offers discounted education as a career development tool. What does this involve?",o:["A. Subsidizing tuition for employees' formal education","B. Sharing management experiences with employees","C. Allowing new employees to work with experienced employees","D. Encouraging employees to learn about employees in different roles"],a:[0]},
  {q:"An HR manager identifies high-performing employees with executive potential. These employees undergo leadership training and receive mentorship from executives within the organization over the next few months. What career planning tool is this?",o:["A. Succession planning","B. Onboarding","C. Job rotation","D. Performance rating"],a:[0]},
  {q:"Fill in the blank: _______ is the degree of fulfillment felt from the learning received.",o:["A. Training experience satisfaction","B. Employee retention","C. Customer satisfaction","D. Learner engagement"],a:[0]},
  {q:"True or false: The Kirkpatrick model of evaluating a training program includes four levels: Reaction, Learning, Behavior, and Results.",o:["A. True","B. False"],a:[0]},
  {q:"Employees at an organization access their training courses through an online platform that tracks and reports their progress to management. What type of software are they using?",o:["A. Learning management system","B. Employee scheduling software","C. Training model software","D. Employee performance system"],a:[0]},
  {q:"An organization compensates employees according to how well they complete tasks. If employees do well, the organization gives them salary increases and bonuses. What payment strategy does the organization use?",o:["A. Pay for performance","B. Pay for attendance","C. Pay for seniority","D. Pay for awards"],a:[0]},
  {q:"Why is competitive pay an essential part of an organization's compensation strategy?",o:["A. It helps attract and retain top talent","B. It encourages high employee turnover rates","C. It helps the organization save money","D. It increases employees' length of time at an organization"],a:[0]},
  {q:"True or False: Employee wellness programs focus on changing undesirable or risky employee behavior such as unhealthy eating habits and smoking.",o:["A. True","B. False"],a:[0]},
  {q:"What can a human resource information system (HRIS) help organizations do?",o:["A. Maintain payroll information in a readily-available format","B. Store employee data on a public website","C. Automate hiring and recruitment","D. Provide additional time off to deserving employees"],a:[0]},
  {q:"What makes a mission statement 'relevant'?",o:["A. Readers should easily understand how it relates to their lives or applies to them","B. The mission statement should only make sense to a specific group of people","C. Readers should feel an emotional connection with the organization","D. The statement should include language that is easy to understand"],a:[0]},
  {q:"An organization creates an inspiring statement that provides insight about its goals and ideals for the future. What is this known as?",o:["A. A vision statement","B. A mission statement","C. A slogan","D. A company tagline"],a:[0]},
  {q:"What best practice is one of the first things you can do to foster an inclusive workplace culture?",o:["A. Detail the current culture","B. Implement a top-down decision-making process","C. Focus on individual achievements","D. Encourage a competitive culture"],a:[0]},
  {q:"One of the goals of human resource management is to comply with legal and social obligations. What does this involve?",o:["A. Understanding the relevant employment laws and regulations","B. Ensuring employees are paid according to their performance","C. Enhancing employees' quality of work and productivity","D. Implementing activities that seek to enhance employees' knowledge or skills"],a:[0]},
  {q:"What term refers to how employees and processes are grouped into departments or functions?",o:["A. Organizational structure","B. Workplace arrangement","C. Workplace hierarchy","D. Team composition"],a:[0]},
  {q:"What is the first step in risk management?",o:["A. Identify the risks","B. Assess the risks","C. Mitigate the risks","D. Monitor the risk management program"],a:[0]},
  {q:"True or false: Business continuity can be threatened by one or any combination of financial, physical, information, or human assets.",o:["A. True","B. False"],a:[0]},
  {q:"When creating a pay package for a role, an HR professional will consider the total compensation. What does this total compensation include? Select all that apply.",o:["A. Wages or salary","B. Incentives","C. Benefits","D. Outside income"],a:[0,1,2]},
  {q:"Which of the following is NOT one of the standard checks organizations use before hiring candidates?",o:["A. Nationality check","B. Credit check","C. Criminal check","D. Motor vehicle check"],a:[0]},
  {q:"What type of background check would an organization use to determine if an application is suitable to work with children or be a security guard?",o:["A. Criminal record check","B. Motor vehicle record check","C. Credit check","D. Medical check"],a:[0]},
  {q:"An HR professional creates a training program in which employees learn individual tasks and concepts and then teach the concepts to others in the group. Which type of learning structure does this refer to?",o:["A. Cooperative learning","B. Simulated learning","C. Competitive learning","D. Independent learning"],a:[0]},
  {q:"According to OSHA, which of the following is one thing that businesses with more than ten employees are required to do?",o:["A. Maintain complete and accurate records of work-related illnesses and injuries","B. Conduct monthly safety inspections and submit reports","C. Conduct weekly fire drills","D. Share yearly records of existing and previous employees"],a:[0]},
  {q:"An HR manager uses talent management systems to automate compensation management. What does compensation management involve?",o:["A. The legal requirements, pay equity within an organization, and competitive pay within an industry","B. Ensuring employees know what they need to do to achieve the organization's goals","C. What training, education, and experience those employees will need to occupy executive roles","D. The performance review process across each department in an organization"],a:[0]},
  {q:"Which of the following are the most common types of childcare benefits an organization might offer? Select all that apply.",o:["A. Assistance finding information","B. Vouchers or discounts","C. Onsite care","D. Tutoring services"],a:[0,1,2]},
  {q:"Fill in the blank: A ______ can be used to assess the economic feasibility of a training program by comparing the total expense associated with the training program to the outcomes derived from the program.",o:["A. cost-benefit analysis","B. training experience","C. SMART goal","D. Feedback form"],a:[0]},
  {q:"Fill in the blank: A ______ is a mandatory suspension from work.",o:["A. furlough","B. lay off","C. divestiture","D. leave of absence"],a:[0]},
  {q:"An HR team analyzes potential threats to an organization and develops strategies to prevent those threats from causing harm. What process is the HR team following?",o:["A. Risk management","B. Project management","C. Employee assessment","D. Hazard prevention"],a:[0]},
  {q:"An organization outlines its reporting structure and key roles in a manual. What is this manual referred to as?",o:["A. Employee handbook","B. Company guide","C. Company directory","D. Employee spec sheet"],a:[0]},
  {q:"Which of the following help organizations create and maintain an inclusive and diverse workplace?",o:["A. Targeted recruiting","B. Team-building activities","C. Designate diversity to one department","D. Encourage employees to conform"],a:[0]},
  {q:"An organization creates a few salary groups with a large difference between the minimum and maximum pay levels. What is this pay structure known as?",o:["A. Broadbanding","B. Red Circle Pay Rate","C. Linear compensation","D. Hierarchical pay"],a:[0]},
  {q:"What term describes the legislation and policies that require all employees be treated the same regardless of race, national origin, age, religion, or sex?",o:["A. Equal Employment Opportunity (EEO)","B. Health Insurance Portability and Accountability Act (HIPAA)","C. Federal Trade Commission (FTC)","D. Employee Assistance Program (EAP)"],a:[0]},
  {q:"When defining HR goals, which of the following is most important to remember?",o:["A. HR goals should align with the overall organizational goals","B. HR goals should focus on reducing the number of employees","C. HR goals should align with the organization's marketing goals","D. HR goals should prioritize gender equality above all else"],a:[0]},
  {q:"You need to hire a new employee that does not currently work at your organization. What type of recruitment should you use?",o:["A. External recruitment","B. Internal recruitment","C. In-house recruitment","D. Intra-team advancement"],a:[0]},
  {q:"An organization offers childcare benefits in the form of a subsidy for employees who have been at the company for a certain amount of time. What childcare benefits do they offer?",o:["A. Vouchers or discounts","B. Unlimited vacation days","C. A monthly stipend","D. Childcare account"],a:[2]},
  {q:"Which type of training includes policies and procedures related to unconscious bias and cultural sensitivity?",o:["A. Diversity and inclusion training","B. Code of conduct/ethics training","C. Morality/self-discovery training","D. Health and safety training"],a:[0]},

let questions=[], cur=0, score=0, answered=0, flags=[], mode='all';
function shuffle(arr){ let a=[...arr]; for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function isMulti(q){ return Array.isArray(q.a) && q.a.length > 1; }
function startQuiz(m){
  mode=m; questions=shuffle(Q);
  if(m==='20') questions=questions.slice(0,20);
  else if(m==='40') questions=questions.slice(0,40);
  else if(m==='60') questions=questions.slice(0,60);
  cur=0; score=0; answered=0; flags=new Array(questions.length).fill(null);
  renderQ();
}
function renderHome(){
  document.getElementById('app').innerHTML=`
    <div class="home-header">
      <h1>HR Management<br>Quiz</h1>
      <p>${Q.length} câu hỏi trắc nghiệm — Chọn chế độ học</p>
    </div>
    <div class="mode-grid">
      <div class="mode-card" onclick="startQuiz('20')">
        <div class="mc-icon">⚡</div>
        <div class="mc-title">Luyện nhanh</div>
        <div class="mc-sub">20 câu ngẫu nhiên</div>
      </div>
      <div class="mode-card" onclick="startQuiz('40')">
        <div class="mc-icon">📖</div>
        <div class="mc-title">Luyện vừa</div>
        <div class="mc-sub">40 câu ngẫu nhiên</div>
      </div>
      <div class="mode-card" onclick="startQuiz('60')">
        <div class="mc-icon">📚</div>
        <div class="mc-title">Luyện nhiều</div>
        <div class="mc-sub">60 câu ngẫu nhiên</div>
      </div>
      <div class="mode-card featured" onclick="startQuiz('all')">
        <div class="mc-icon">🎯</div>
        <div class="mc-title">Thi thử đầy đủ</div>
        <div class="mc-sub">Tất cả ${Q.length} câu</div>
      </div>
    </div>
    <div class="hint-box">
      <strong>Lưu ý:</strong> Một số câu hỏi có <strong>nhiều đáp án đúng</strong>. Bạn cần chọn tất cả các đáp án đúng trước khi nhấn xác nhận. Câu hỏi được xáo trộn ngẫu nhiên mỗi lần.
    </div>
  `;
}
function renderQ(){
  if(cur>=questions.length){renderResult();return;}
  const q=questions[cur];
  const L=['A','B','C','D'];
  const pct=Math.round((cur/questions.length)*100);
  const done=flags[cur]!==null;
  const multi=isMulti(q);
  document.getElementById('app').innerHTML=`
    <div class="quiz-header">
      <button class="quiz-back" onclick="renderHome()">← Trang chủ</button>
      <div class="score-pills">
        <div class="pill c">✓ ${score}</div>
        <div class="pill w">✗ ${answered-score}</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-card">
      <div class="q-num">Câu ${cur+1} / ${questions.length}${multi?' — Chọn tất cả đáp án đúng':''}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts">
        ${q.o.map((opt,i)=>`
          <button class="opt-btn" id="o${i}" onclick="${multi&&!done?'toggleOpt('+i+')':'pick('+i+')'}" ${done?'disabled':''}>
            <span class="opt-letter">${L[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div id="fb"></div>
    </div>
    <div class="nav-row" id="nav">
      ${done?`<button class="btn-next" onclick="nextQ()">Câu tiếp theo →</button>`:
        multi?`<button class="btn-next" onclick="confirmMulti()" style="background:var(--accent)">Xác nhận đáp án</button>`:''}
    </div>
  `;
  if(done) showFeedback(flags[cur],q.a,multi);
}
let selectedOpts=[];
function toggleOpt(i){
  const btn=document.getElementById('o'+i);
  if(selectedOpts.includes(i)){
    selectedOpts=selectedOpts.filter(x=>x!==i);
    btn.style.background='';
    btn.style.borderColor='';
    btn.querySelector('.opt-letter').style.color='';
  } else {
    selectedOpts.push(i);
    btn.style.background='var(--accent-bg)';
    btn.style.borderColor='var(--accent)';
    btn.querySelector('.opt-letter').style.color='var(--accent)';
  }
}
function confirmMulti(){
  if(selectedOpts.length===0) return;
  const q=questions[cur];
  const correct=q.a.slice().sort().join(',');
  const chosen=selectedOpts.slice().sort().join(',');
  const isCorrect=correct===chosen;
  if(isCorrect) score++;
  answered++;
  flags[cur]=selectedOpts.slice().sort();
  for(let j=0;j<4;j++){const b=document.getElementById('o'+j);if(b)b.disabled=true;}
  showFeedback(selectedOpts.slice().sort(),q.a,true);
  document.getElementById('nav').innerHTML=`<button class="btn-next" onclick="nextQ()">Câu tiếp theo →</button>`;
  selectedOpts=[];
}
function pick(i){
  const q=questions[cur];
  const isCorrect=q.a[0]===i;
  if(isCorrect) score++;
  answered++;
  flags[cur]=[i];
  for(let j=0;j<4;j++){const b=document.getElementById('o'+j);if(b)b.disabled=true;}
  showFeedback([i],q.a,false);
  document.getElementById('nav').innerHTML=`<button class="btn-next" onclick="nextQ()">Câu tiếp theo →</button>`;
}
function showFeedback(chosen,correct,multi){
  const L=['A','B','C','D'];
  const q=questions[cur];
  const correctArr=Array.isArray(correct)?correct:[correct];
  const chosenArr=Array.isArray(chosen)?chosen:[chosen];
  const isCorrect=correctArr.slice().sort().join(',')===chosenArr.slice().sort().join(',');
  for(let i=0;i<4;i++){
    const b=document.getElementById('o'+i);
    if(!b)continue;
    b.style.background=''; b.style.borderColor=''; b.querySelector('.opt-letter').style.color='';
    if(correctArr.includes(i)){
      b.classList.add(chosenArr.includes(i)?'sc':'sr');
    } else if(chosenArr.includes(i)&&!correctArr.includes(i)){
      b.classList.add('sw');
    }
  }
  const fb=document.getElementById('fb');
  if(fb){
    if(isCorrect){
      fb.innerHTML=`<div class="feedback ok">✓ Chính xác!</div>`;
    } else {
      const corrText=correctArr.map(i=>L[i]+'. '+q.o[i]).join(' / ');
      fb.innerHTML=`<div class="feedback no">✗ Sai. Đáp án đúng: <strong>${corrText}</strong></div>`;
    }
  }
}
function nextQ(){cur++;selectedOpts=[];renderQ();}
function renderResult(){
  const pct=Math.round((score/questions.length)*100);
  const wrong=questions.length-score;
  const msg=pct>=80?'🎉 Xuất sắc! Bạn đã nắm vững kiến thức.':pct>=60?'👍 Khá tốt! Ôn thêm các câu sai nhé.':'📚 Cần ôn tập thêm. Hãy thử lại!';
  document.getElementById('app').innerHTML=`
    <div style="padding:20px 0 0;">
      <div class="result-wrap">
        <div class="result-pct">${pct}%</div>
        <div class="result-msg">${msg}</div>
        <div class="result-grid">
          <div class="r-stat"><div class="r-val g">${score}</div><div class="r-lbl">Câu đúng</div></div>
          <div class="r-stat"><div class="r-val r">${wrong}</div><div class="r-lbl">Câu sai</div></div>
          <div class="r-stat"><div class="r-val">${questions.length}</div><div class="r-lbl">Tổng câu</div></div>
        </div>
        <div class="result-btns">
          <button class="btn-solid" onclick="startQuiz('${mode}')">Làm lại bộ này</button>
          <button class="btn-outline" onclick="renderHome()">Chọn bộ khác</button>
        </div>
      </div>
    </div>
  `;
}
renderHome();
</script>
</body>
</html>
